workflows:
  android-release:
    name: Android Release Build (universal APK + AAB)
    instance_type: mac_mini_m1
    max_build_duration: 60

    environment:
      groups:
        - keystore_credentials
      flutter: stable
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches

    scripts:
      - name: Flutter version
        script: |
          flutter --version

      - name: Clean project
        script: |
          flutter clean
          rm -rf build/

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Verify assets cleaned (size optimization)
        script: |
          echo "=== assets/images/ ==="
          ls -lh assets/images/ || true
          echo "Should contain app_icon.png and tutorial_*.png"
          # Fail if large PNGs still present
                    if [ -f assets/images/app_icon_new.png ]; then echo "ERROR: app_icon_new.png still exists"; exit 1; fi
          if [ -f assets/images/splash_logo.png ]; then echo "ERROR: splash_logo.png still exists"; exit 1; fi
          echo "=== assets/l10n/ check ==="
          ls -1 assets/l10n/*.json.gz | wc -l || true
          echo "Should show exactly 49 compressed translation asset files"

      - name: Analyze project
        script: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Verify 50-language localization coverage
        script: |
          python3 scripts/localization_audit.py

      - name: Verify production quiz quality
        script: |
          python3 scripts/quiz_audit.py

      - name: Verify production wiring content
        script: |
          python3 scripts/wiring_audit.py

      - name: Run tests
        script: |
          flutter test

      - name: Decode keystore if available
        script: |
          if [ -n "$CM_KEYSTORE" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/android/app/key.jks"
            cat > "$CM_BUILD_DIR/android/key.properties" << EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=key.jks
          EOF
            echo "✅ SUCCESS: Keystore decoded and key.properties generated successfully!"
            echo "The app will be signed with the production release certificate."
          else
            echo "❌ WARNING: No keystore provided in Environment Variables."
            echo "Building unsigned/debug artifacts."
          fi

      # Optimized localization architecture: 49 languages stored in assets/l10n/*.json.gz
      # Eliminates 46MB of static Dart string maps from libapp.so (saves ~15-20MB in APK)
      # ONE universal APK carrying ARM64 (arm64-v8a) native libraries only.
      #
      # --split-per-abi is intentionally NOT used: it emits a separate APK per
      # ABI. Omitting it makes Flutter pack every ABI listed by
      # --target-platform into one app-release.apk.
      #
      # armeabi-v7a / x86 / x86_64 stay excluded - the app ships 64-bit ARM
      # only.
      - name: Build universal release APK (arm64-v8a only)
        script: |
          flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=./symbols
          echo "=== Universal APK ==="
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      # Fail the build if the APK is not arm64-v8a-only, rather than
      # discovering it after upload. unzip -l lists the archive contents;
      # a compliant APK contains lib/arm64-v8a/libflutter.so and no other ABI.
      - name: Verify APK is arm64-v8a only
        script: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          echo "=== Native libraries in $APK ==="
          unzip -l "$APK" | grep '^.*lib/' || true
          if unzip -l "$APK" | grep -q "lib/arm64-v8a/libflutter.so"; then
            echo "OK: arm64-v8a present"
          else
            echo "ERROR: arm64-v8a missing from APK"
            exit 1
          fi
          echo "=== Confirming 32-bit ARM and x86 ABIs are absent ==="
          if unzip -l "$APK" | grep -qE 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "ERROR: unexpected 32-bit ARM or x86 native libraries found"
            exit 1
          else
            echo "OK: no armeabi-v7a / x86 / x86_64 libraries"
          fi

      # AAB for Google Play, arm64-v8a only. Play splits this per device, so
      # users still download only their own ABI.
      - name: Build release App Bundle (arm64-v8a only)
        script: |
          flutter build appbundle --release --target-platform android-arm64 --obfuscate --split-debug-info=./symbols
          echo "=== AAB ==="
          ls -lh build/app/outputs/bundle/release/app-release.aab

      # Fail the build if the bundle is not arm64-v8a-only. An AAB is a zip;
      # its native libraries live under base/lib/<abi>/.
      - name: Verify AAB is arm64-v8a only
        script: |
          set -e
          AAB=build/app/outputs/bundle/release/app-release.aab
          echo "=== Native libraries in $AAB ==="
          unzip -l "$AAB" | grep '^.*lib/' || true
          if unzip -l "$AAB" | grep -q "base/lib/arm64-v8a/libflutter.so"; then
            echo "OK: arm64-v8a present"
          else
            echo "ERROR: arm64-v8a missing from AAB"
            exit 1
          fi
          echo "=== Confirming 32-bit ARM and x86 ABIs are absent ==="
          if unzip -l "$AAB" | grep -qE 'base/lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "ERROR: unexpected 32-bit ARM or x86 native libraries found"
            exit 1
          else
            echo "OK: no armeabi-v7a / x86 / x86_64 libraries"
          fi

    artifacts:
      # Exact paths, not globs: a glob such as *release*.apk would also pick up
      # per-ABI APKs if they ever reappear in the output directory.
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true