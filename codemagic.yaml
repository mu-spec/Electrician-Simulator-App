workflows:
  android-release:
    name: Android Release Build (universal APK + AAB)
    instance_type: mac_mini_m1
    max_build_duration: 60

    environment:
      groups:
        - keystore_credentials
      flutter: stable
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches

    scripts:
      - name: Flutter version
        script: |
          flutter --version

      - name: Clean project
        script: |
          flutter clean
          rm -rf build/

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Verify assets cleaned (size optimization)
        script: |
          echo "=== assets/images/ ==="
          ls -lh assets/images/ || true
          echo "Should contain app_icon.png and tutorial_*.png"
          # Fail if large PNGs still present
                    if [ -f assets/images/app_icon_new.png ]; then echo "ERROR: app_icon_new.png still exists"; exit 1; fi
          if [ -f assets/images/splash_logo.png ]; then echo "ERROR: splash_logo.png still exists"; exit 1; fi
          echo "=== assets/l10n/ check ==="
          ls -1 assets/l10n/*.json.gz | wc -l || true
          echo "Should show exactly 49 compressed translation asset files"

      - name: Analyze project
        script: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Verify 50-language localization coverage
        script: |
          python3 scripts/localization_audit.py

      - name: Verify production quiz quality
        script: |
          python3 scripts/quiz_audit.py

      - name: Verify production wiring content
        script: |
          python3 scripts/wiring_audit.py

      - name: Run tests
        script: |
          flutter test

      - name: Decode keystore if available
        script: |
          if [ -n "$CM_KEYSTORE" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/android/app/key.jks"
            cat > "$CM_BUILD_DIR/android/key.properties" << EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=key.jks
          EOF
            echo "✅ SUCCESS: Keystore decoded and key.properties generated successfully!"
            echo "The app will be signed with the production release certificate."
          else
            echo "❌ WARNING: No keystore provided in Environment Variables."
            echo "Building unsigned/debug artifacts."
          fi

      # Optimized localization architecture: 49 languages stored in assets/l10n/*.json.gz
      # Eliminates 46MB of static Dart string maps from libapp.so (saves ~15-20MB in APK)
      # ONE universal APK carrying both ARM ABIs in a single file.
      #
      # --split-per-abi is intentionally NOT used: it emits a separate APK per
      # ABI. Omitting it makes Flutter pack every ABI listed by
      # --target-platform into one app-release.apk.
      #
      # x86 / x86_64 stay excluded - they target emulators and a small number of
      # Chromebooks, not real phones.
      - name: Build universal release APK (armeabi-v7a + arm64-v8a)
        script: |
          flutter build apk --release --target-platform android-arm64,android-arm --obfuscate --split-debug-info=./symbols
          echo "=== Universal APK ==="
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      # Fail the build if either ABI is missing from the universal APK, rather
      # than discovering it after upload. unzip -l lists the archive contents;
      # a compliant universal APK contains lib/<abi>/libflutter.so for each ABI.
      - name: Verify universal APK contains both ABIs
        script: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          echo "=== Native libraries in $APK ==="
          unzip -l "$APK" | grep '^.*lib/' || true
          for ABI in armeabi-v7a arm64-v8a; do
            if unzip -l "$APK" | grep -q "lib/$ABI/libflutter.so"; then
              echo "OK: $ABI present"
            else
              echo "ERROR: $ABI missing from universal APK"
              exit 1
            fi
          done
          echo "=== Confirming x86 ABIs are absent ==="
          if unzip -l "$APK" | grep -qE 'lib/(x86|x86_64)/'; then
            echo "WARNING: unexpected x86 native libraries found"
          else
            echo "OK: no x86 / x86_64 libraries"
          fi

      # AAB for Google Play. Play splits this per device, so users still
      # download only their own ABI.
      - name: Build release App Bundle (armeabi-v7a + arm64-v8a)
        script: |
          flutter build appbundle --release --target-platform android-arm64,android-arm --obfuscate --split-debug-info=./symbols
          echo "=== AAB ==="
          ls -lh build/app/outputs/bundle/release/app-release.aab

    artifacts:
      # Exact paths, not globs: a glob such as *release*.apk would also pick up
      # per-ABI APKs if they ever reappear in the output directory.
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true