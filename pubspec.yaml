name: electrician_simulator_app
description: "Electrician Simulator App - All-in-One Electrical Engineering Companion"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3

  # Local Database
  sqflite: ^2.3.0
  path: ^1.8.3
  hive_flutter: ^1.1.0

  # Storage
  # Persists Job Manager project photos outside temporary/cache storage.
  path_provider: ^2.1.6

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.2.2
  share_plus: 10.0.1
  package_info_plus: 9.0.1
  image_picker: ^1.0.7
  pdf: ^3.11.1
  printing: ^5.13.4

  # No advertising SDK. This app serves no ads.
  # purchases_flutter: ^6.1.0

dependency_overrides:
  # Keep the plugin-based implementation with bundled iOS privacy manifest.
  path_provider_foundation: 2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
    - assets/diagrams/
    - assets/l10n/

  # App uses system Arial via AppTheme.fontFamily (no bundled font package).